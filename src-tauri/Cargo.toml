[package]
name = "stickonvid"
version = "0.1.0"
edition = "2021"

[lib]
name = "stickonvid_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
